[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pip-upgrade"
version = "0.1.0"
description = "交互式终端工具：检查并升级当前 Python 环境的依赖包"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "pip-upgrade" }]
keywords = ["pip", "upgrade", "tui", "textual", "packaging"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "textual>=0.80",
    "typer>=0.12",
    "packaging>=24.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
pip-upgrade = "pip_upgrade.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
